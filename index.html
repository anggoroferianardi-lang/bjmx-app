<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BJMX - Banjarmasin Express</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#f5f5f5}
.header{background:#e60000;color:#fff;text-align:center;padding:20px}
.header h1{font-size:32px}
.header p{color:#ffcc00;font-weight:bold}
.card{background:#fff;margin:15px;border-radius:15px;padding:20px;box-shadow:0 2px 10px rgba(0,0,0,.1)}
.btn{display:block;width:100%;padding:15px;border:none;border-radius:10px;font-size:18px;font-weight:bold;cursor:pointer;margin:10px 0}
.btn-yellow{background:#ffcc00;color:#000}
.btn-black{background:#111;color:#fff}
input,select,textarea{width:100%;padding:12px;margin:8px 0;border:1px solid #ddd;border-radius:8px;font-size:16px}
.hidden{display:none}
.price-box{background:#fff8e1;padding:15px;border-radius:10px;margin:10px 0}
</style>
</head>
<body>
<div class="header"><h1>BJMX</h1><p>Banjarmasin Express</p><p style="color:#fff;font-weight:normal">Chat Langsung, Paket Sampai - Aman & Nyaman</p></div>
<div class="card">
<h3>Saya adalah:</h3>
<button class="btn btn-yellow" onclick="pilih('customer')">CUSTOMER</button>
<button class="btn btn-black" onclick="pilih('kurir')">KURIR</button>
<label>Nomor HP</label>
<input id="hp" placeholder="082112345678">
<div id="formCustomer" class="hidden">
<h3>Order Paket - Customer</h3>
<input id="nama" placeholder="Nama Pengirim">
<input id="alamatJemput" placeholder="Alamat Jemput">
<input id="alamatTujuan" placeholder="Alamat Tujuan">
<select id="jenis"><option>Paket Kecil - Rp 10.000</option><option>Paket Sedang - Rp 15.000</option><option>Paket Besar - Rp 25.000</option><option>Dokumen - Rp 8.000</option></select>
<textarea id="catatan" placeholder="Catatan untuk kurir"></textarea>
<div class="price-box"><b>Total: <span id="total">Rp 10.000</span></b></div>
<button class="btn" style="background:#25D366;color:#fff" onclick="kirimWA()">KIRIM VIA WHATSAPP</button>
</div>
<div id="formKurir" class="hidden">
<h3>Login Kurir</h3>
<input placeholder="Nama Kurir">
<input placeholder="No. Plat / ID Kurir">
<button class="btn btn-black" onclick="alert('Selamat datang Kurir BJMX!')">MASUK SEBAGAI KURIR</button>
</div>
</div>
<script>
function pilih(t){document.getElementById('formCustomer').classList.add('hidden');document.getElementById('formKurir').classList.add('hidden');if(t=='customer')document.getElementById('formCustomer').classList.remove('hidden');else document.getElementById('formKurir').classList.remove('hidden');}
document.getElementById('jenis').addEventListener('change',function(){var v=this.value;if(v.includes('10.000'))document.getElementById('total').innerText='Rp 10.000';if(v.includes('15.000'))document.getElementById('total').innerText='Rp 15.000';if(v.includes('25.000'))document.getElementById('total').innerText='Rp 25.000';if(v.includes('8.000'))document.getElementById('total').innerText='Rp 8.000';});
function kirimWA(){var hp=document.getElementById('hp').value;var nama=document.getElementById('nama').value;var jemput=document.getElementById('alamatJemput').value;var tujuan=document.getElementById('alamatTujuan').value;var jenis=document.getElementById('jenis').value;var total=document.getElementById('total').innerText;var pesan='Halo BJMX! Saya mau order:%0A Nama: '+nama+'%0A HP: '+hp+'%0A Jemput: '+jemput+'%0A Tujuan: '+tujuan+'%0A Jenis: '+jenis+'%0A Total: '+total;window.open('https://wa.me/6282112345678?text='+pesan,'_blank');}
</script>
</body>
</html>
